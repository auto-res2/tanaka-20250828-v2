# Default configuration for HEAT experiments
seed: 42
device: auto
model_name: sshleifer/tiny-gpt2

# Grouping for exits
group_size: 2

training:
  epochs: 1
  batch_size: 4
  lr: 5e-5
  max_len: 128
  n_train_samples: 32
  n_val_samples: 16

eval:
  max_new_tokens: 64
  taus: [0.6, 0.7, 0.8, 0.9, 0.95]
  k_window: 32
  risk: 0.05
  calm_compare: true
